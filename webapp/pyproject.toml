[project]
name = "suitesparse-benchmark-viewer"
version = "1.0.0"
description = "FastAPI webapp to visualize SuiteSparse BLAS benchmark results"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "jinja2>=3.1.3",
    "python-multipart>=0.0.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "httpx>=0.26.0",
]
