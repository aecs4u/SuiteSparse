<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SuiteSparse BLAS Benchmark{% endblock %}</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .navbar {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 12px;
            padding: 15px 30px;
            margin-bottom: 25px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }

        .navbar-brand {
            font-size: 1.5rem;
            font-weight: 700;
            color: #667eea;
            text-decoration: none;
        }

        .navbar-nav {
            display: flex;
            gap: 20px;
            list-style: none;
        }

        .navbar-nav a {
            color: #333;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 6px;
            transition: all 0.2s;
        }

        .navbar-nav a:hover {
            background: #667eea;
            color: white;
        }

        .navbar-nav a.active {
            background: #667eea;
            color: white;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .card-header {
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .card-header h2 {
            color: #333;
            font-size: 1.8rem;
        }

        .card-body {
            color: #555;
            line-height: 1.6;
        }

        .module-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .module-card {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border-radius: 8px;
            padding: 20px;
            transition: transform 0.2s;
        }

        .module-card:hover {
            transform: translateY(-5px);
        }

        .module-card h3 {
            color: #667eea;
            margin-bottom: 10px;
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-right: 8px;
        }

        .badge-blas { background: #ffd700; color: #333; }
        .badge-sparse { background: #667eea; color: white; }
        .badge-graph { background: #764ba2; color: white; }

        .chart-container {
            position: relative;
            height: 400px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        table th {
            background: #f5f7fa;
            padding: 12px;
            text-align: left;
            font-weight: 600;
            color: #333;
        }

        table td {
            padding: 12px;
            border-bottom: 1px solid #f0f0f0;
        }

        table tr:hover {
            background: #f9f9f9;
        }

        .footer {
            text-align: center;
            color: white;
            margin-top: 40px;
            padding: 20px;
        }

        @media (max-width: 768px) {
            .navbar {
                flex-direction: column;
                gap: 15px;
            }

            .navbar-nav {
                flex-direction: column;
                width: 100%;
            }
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <nav class="navbar">
        <a href="/" class="navbar-brand">📊 SuiteSparse Benchmark</a>
        <ul class="navbar-nav">
            <li><a href="/" {% if request.url.path == "/" %}class="active"{% endif %}>Home</a></li>
            <li><a href="/results" {% if request.url.path.startswith("/results") %}class="active"{% endif %}>Results</a></li>
            <li><a href="/runs" {% if request.url.path == "/runs" %}class="active"{% endif %}>Runs</a></li>
            <li><a href="/modules" {% if request.url.path == "/modules" %}class="active"{% endif %}>Modules</a></li>
            <li><a href="/benchmarks" {% if request.url.path.startswith("/benchmarks") %}class="active"{% endif %}>Benchmarks</a></li>
            <li><a href="/systems" {% if request.url.path == "/systems" %}class="active"{% endif %}>Systems</a></li>
            <li><a href="/c23-migration" {% if request.url.path == "/c23-migration" %}class="active"{% endif %} style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; font-weight: 600;">🚀 C23</a></li>
        </ul>
    </nav>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <div class="footer">
        <p>SuiteSparse BLAS Benchmark Suite | Powered by FastAPI & Chart.js</p>
    </div>

    {% block extra_js %}{% endblock %}
</body>
</html>
